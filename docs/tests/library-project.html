<!doctype html>
<meta charset="utf-8">
<title>Library Browser remote project regression</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="../index.html" width="1200" height="900" title="Tracker under test"></iframe>
<script>
// Serve this project on localhost or HTTPS. This test requires internet.
(async () => {
  const output = document.getElementById('result');
  const app = document.getElementById('app');
  const url = 'https://opensourcephysics.github.io/resources/CAB/experiments/BallToss.zip';
  async function waitFor(check, label) {
    for (let i = 0; i < 180; i++) {
      const result = check();
      if (result) return result;
      await new Promise(resolve => setTimeout(resolve, 500));
    }
    throw new Error('Timed out: ' + label);
  }
  try {
    const frame = await waitFor(() => app.contentWindow.Tracker?.app?.getMainFrame$?.(), 'Tracker startup');
    frame.openLibraryBrowser$();
    await waitFor(() => frame.libraryBrowser, 'Library Browser startup');
    const w = app.contentWindow;
    const resource = w.Clazz.new_(w.Clazz.load('org.opensourcephysics.tools.LibraryResource').c$$S, ['Ball Toss']);
    resource.setTarget$S(url);
    // Same entry point used when the Library Browser opens a selected record.
    frame.loadLibraryRecord$org_opensourcephysics_tools_LibraryResource(resource);
    const panel = await waitFor(() => {
      const panel = frame.getSelectedPanel$();
      return panel?.getVideo$?.()?.getFrameCount$?.() > 0 && panel.openedFromPath?.includes('BallToss') ? panel : null;
    }, 'BallToss project and embedded MP4');
    output.textContent = 'PASS ' + JSON.stringify({title: panel.getTitle$(), frames: panel.getVideo$().getFrameCount$(), tracks: panel.getTracks$().size$(), path: panel.openedFromPath});
  } catch (error) {
    output.textContent = 'FAIL ' + (error.stack || error);
  }
})();
</script>
